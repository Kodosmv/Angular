<div>
  <div style="background-color: blue; color: white; padding: 0.75rem">
    {{ title }}
  </div>
  <div style="padding: 1rem">
    <div>
      <table style="width: 100%">
        <thead>
          <tr style="background-color: lightgrey; text-align: center">
            <th>{{ headers.image }}</th>
            <th>{{ headers.desc }}</th>
            <th>{{ headers.price }}</th>
            <th>{{ headers.avail }}</th>
          </tr>
        </thead>
        <tbody>
          <!-- Aquí van los productos. Por ahora se queda vacío -->
          @for (product of products; track product.id) {
          <tr>
            <td><img [src]="product.imageUrl" alt="" /></td>
            <td>{{ product.desc }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.avail }}</td>
            Page: 2
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

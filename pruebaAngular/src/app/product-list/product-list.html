<div>
  <div style="background-color: blue; color: white; padding: 0.75rem">
    {{ title }}
  </div>
  <div class="card-block">
    <form class="form">
      <div class="form-group row">
        <label class="col-form-label col-sm-2 text-sm-right" for="filterDesc">Filtro:</label>
        <div class="col-sm-5">
          <input
            type="text"
            [(ngModel)]="filterSearch"
            class="form-control"
            name="filterDesc"
            id="filterDesc"
            placeholder="Filter..."
          />
        </div>
        Page: 6
        <label class="col-form-label col-sm-5"> Filtrando por: {{ filterSearch }}</label>
      </div>
    </form>
  </div>
  <div style="padding: 1rem">
    <div>
      <table style="width: 100%">
        <thead>
          <tr style="background-color: lightgrey; text-align: center">
            <th>
              <button
                class="btn btn-sm"
                [ngClass]="{ 'btn-danger': showImage, 'btn-primary': !showImage }"
                (click)="toggleImage()"
              >
                {{ showImage ? 'Ocultar' : 'Mostrar' }} imagen
              </button>
              Page: 4
            </th>
            <th>{{ headers.image }}</th>
            <th>{{ headers.desc }}</th>
            <th>{{ headers.price }}</th>
            <th>{{ headers.avail }}</th>
          </tr>
        </thead>
        <tbody>
          <!-- Aquí van los productos. Por ahora se queda vacío -->
          @for (product of products; track product.id) {
          <tr>
            <td>@if (showImage) { <img [src]="product.imageUrl" alt="" />}</td>
            <td>{{ product.desc }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.avail }}</td>
            Page: 2
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
